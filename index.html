<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIELofc</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0A0A0A;color:#fff;font-family:Inter}
.card{background:#121212;border-radius:16px}
.btn{background:#00D1FF;color:#000;font-weight:700}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:99;align-items:center;justify-content:center}
.modal-content{background:#1A1A1A;padding:20px;border-radius:16px;width:90%;max-width:400px}
.durasi-btn{border:1px solid #333;padding:8px;border-radius:8px;text-align:center;cursor:pointer}
.durasi-btn.active{border-color:#00D1FF;background:#00D1FF20}
</style>
</head>
<body>

<!-- HEADER + BANNER SAMA SEPERTI SEBELUMNYA -->
<div class="flex justify-between items-center p-4 bg-black"><div class="text-xl font-black">NIEL<span class="text-[#00D1FF]">ofc</span></div><div>☰</div></div>
<div class="bg-gradient-to-r from-purple-900 to-black p-5"><h1 class="text-3xl font-black">Flourite Plans</h1></div>

<!-- PRODUK -->
<div class="p-4 grid grid-cols-2 gap-3">

  <!-- CARD MIGUL -->
  <div class="card p-3">
    <span class="bg-purple-700 text-[10px] px-2 py-1 rounded">ANDROID</span>
    <img src="https://i.ibb.co.com/0pL31MRx/IMG-6456.png" class="w-full h-24 object-contain my-2">
    <p class="font-bold">MIGUL LITE & PRO</p>
    <p class="text-xs text-gray-400">Mulai dari Rp35.000</p>
    <button onclick="openModal('MIGUL', {lite1:35000,lite7:100000,lite30:230000,pro1:40000,pro7:120000,pro30:270000})" class="btn w-full py-2 rounded mt-2">Beli Sekarang</button>
  </div>

  <!-- CARD FLUORITE -->
  <div class="card p-3">
    <span class="bg-pink-600 text-[10px] px-2 py-1 rounded">IOS</span>
    <img src="https://i.ibb.co.com/r2wp4rPW/IMG-6458.jpg" class="w-full h-24 object-contain my-2">
    <p class="font-bold">FLUORITE</p>
    <p class="text-xs text-gray-400">Mulai dari Rp50.000</p>
    <button onclick="openModal('FLUORITE', {d1:50000,d2:150000,d30:350000})" class="btn w-full py-2 rounded mt-2">Beli Sekarang</button>
  </div>

  <!-- CARD PUBG KING -->
  <div class="card p-3">
    <span class="bg-yellow-700 text-[10px] px-2 py-1 rounded">PUBG</span>
    <img src="https://i.ibb.co.com/LdQWD9MQ/IMG-6423.jpg" class="w-full h-24 object-contain my-2">
    <p class="font-bold">PUBG KING MOD</p>
    <p class="text-xs text-gray-400">Mulai dari Rp60.000</p>
    <button onclick="openModal('PUBG KING', {d1:60000,d7:170000,d30:400000})" class="btn w-full py-2 rounded mt-2">Beli Sekarang</button>
  </div>

  <!-- CARD DRIP -->
  <div class="card p-3">
    <span class="bg-purple-700 text-[10px] px-2 py-1 rounded">ANDROID</span>
    <img src="https://i.ibb.co.com/Qvbwh1Pw/IMG-6459.jpg" class="w-full h-24 object-contain my-2">
    <p class="font-bold">DRIP CLIENT</p>
    <p class="text-xs text-gray-400">Mulai dari Rp12.000</p>
    <button onclick="openModal('DRIP', {d1:12000,d3:25000,d7:50000,d15:90000,d30:130000})" class="btn w-full py-2 rounded mt-2">Beli Sekarang</button>
  </div>

</div>

<!-- POPUP PILIH DURASI -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h2 id="modalTitle" class="font-bold text-lg mb-3"></h2>
    <div id="durasiList" class="grid grid-cols-2 gap-2 mb-4"></div>
    <p class="text-center text-xl font-bold mb-3">Total: <span id="totalHarga">Rp0</span></p>
    <button onclick="orderWA()" class="btn w-full py-3 rounded">Order via WhatsApp</button>
    <button onclick="closeModal()" class="w-full py-2 mt-2 text-gray-400">Batal</button>
  </div>
</div>

<script>
let produkSekarang = "";
let hargaSekarang = 0;

function openModal(nama, hargaObj){
  produkSekarang = nama;
  document.getElementById('modal').style.display = 'flex';
  document.getElementById('modalTitle').innerText = nama;

  let list = "";
  for(const key in hargaObj){
    let label = key.replace('d','').replace('lite',' Lite ').replace('pro',' Pro ');
    list += `<div class="durasi-btn" onclick="pilihDurasi(this, ${hargaObj[key]}, '${nama} ${label}')">${label} Day<br>Rp${hargaObj[key].toLocaleString('id')}</div>`;
  }
  document.getElementById('durasiList').innerHTML = list;
}

function pilihDurasi(el, harga, namaDurasi){
  document.querySelectorAll('.durasi-btn').forEach(e=>e.classList.remove('active'));
  el.classList.add('active');
  hargaSekarang = harga;
  produkSekarang = namaDurasi;
  document.getElementById('totalHarga').innerText = 'Rp' + harga.toLocaleString('id');
}

function orderWA(){
  if(hargaSekarang == 0){ alert('Pilih durasi dulu!'); return; }
  window.open(`https://wa.me/6285194336082?text=Halo NIELofc, saya mau order ${produkSekarang} - Rp${hargaSekarang.toLocaleString('id')}`);
  closeModal();
}

function closeModal(){ document.getElementById('modal').style.display = 'none'; }
</script>

</body>
</html>
