<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Cheat - NiellBinn</title>
<style>
  body { background:#0a0a0a; color:#fff; font-family:Arial; text-align:center; padding:20px; }
  .logo { font-size:24px; font-weight:bold; color:#00ff88; margin-bottom:10px; }
  .produk { font-size:18px; margin-bottom:20px; }
  .durasi-box { display:flex; justify-content:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .durasi { border:2px solid #333; padding:10px 15px; border-radius:10px; cursor:pointer; width:100px; }
  .durasi.selected { border-color:#00ff88; background:#00ff8811; }
  .harga { color:#00ff88; font-weight:bold; }
  input { width:80%; padding:12px; border-radius:8px; border:1px solid #333; background:#111; color:#fff; margin-bottom:20px; text-align:center; }
  .btn-order { display:inline-block; background:#25D366; color:#fff; padding:14px 30px; border-radius:10px; font-weight:bold; text-decoration:none; font-size:16px; }
  .btn-order:active { background:#1ebe5b; }
  .note { font-size:12px; color:#888; margin-top:15px; }
</style>
</head>
<body>

<div class="logo">NIELLBINN CHEAT</div>
<div class="produk">Fluorite ios</div>

<div class="durasi-box">
  <div class="durasi" data-durasi="1 Day" data-harga="Rp10.000">
    <div>1 Day</div>
    <div class="harga">Rp10.000</div>
  </div>
  <div class="durasi" data-durasi="7 Day" data-harga="Rp35.000">
    <div>7 Day</div>
    <div class="harga">Rp35.000</div>
  </div>
  <div class="durasi selected" data-durasi="10 Day" data-harga="Rp45.000">
    <div>10 Day</div>
    <div class="harga">Rp45.000</div>
  </div>
  <div class="durasi" data-durasi="15 Day" data-harga="Rp65.000">
    <div>15 Day</div>
    <div class="harga">Rp65.000</div>
  </div>
</div>

<input type="number" id="noWA" placeholder="Isi No WhatsApp 08xxxxxxxxx">

<a href="#" id="waButton" class="btn-order">ORDER VIA WHATSAPP</a>

<div class="note">Order akan dikirim otomatis ke WA Admin</div>

<script>
// 1. PILIH DURASI
document.querySelectorAll('.durasi').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.durasi').forEach(d => d.classList.remove('selected'));
    item.classList.add('selected');
  });
});

// 2. TOMBOL WA OTOMATIS
document.getElementById('waButton').onclick = function(e) {
    e.preventDefault();
    
    // GANTI NOMOR ADMIN KAMU DISINI
    let nomorAdmin = "62812xxxxxxx"; 
    
    let nomorUser = document.getElementById('noWA').value;
    let selected = document.querySelector('.durasi.selected');
    let durasi = selected.getAttribute('data-durasi');
    let harga = selected.getAttribute('data-harga');
    let produk = document.querySelector('.produk').innerText;
    
    if(nomorUser == "" || nomorUser.length < 10) {
        alert("⚠️ Isi No WhatsApp yang bener dulu bos!");
        return;
    }

    // Pesan otomatis
    let pesan = `Halo Admin NiellBinn%0A%0A
Saya mau ORDER:%0A
Produk: ${produk}%0A
Durasi: ${durasi}%0A
Harga: ${harga}%0A
No WA: ${nomorUser}%0A%0A
Terima kasih`;

    // Buka WA
    let url = `https://wa.me/${nomorAdmin}?text=${pesan}`;
    window.open(url, '_blank');
}
</script>

</body>
</html>
